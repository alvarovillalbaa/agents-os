name: Agents OS CRM checks
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact evaluator source candidate
        required: true
        type: string
permissions:
  contents: read
jobs:
  crm:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_eval_only
          POSTGRES_DB: postgres
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SOURCE_COMMIT: ${{ inputs.source_sha }}
      AGENTS_OS_PUBLIC_REPOSITORY: ${{ !github.event.repository.private }}
      EVAL_POSTGRES_ADMIN_URL: postgresql://postgres:disposable_eval_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
      - name: Build and check actual CRM package in owned scratch
        run: node extensions/agents-os/checks/run-crm-checks.mjs --source-commit "$SOURCE_COMMIT"
      - name: Retain safe original evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agents-os-crm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AGENTS_OS_EVAL_PACKET }}
          if-no-files-found: error
          retention-days: 1
